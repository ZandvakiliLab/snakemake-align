$schema: "https://json-schema.org/draft/2020-12/schema"
description: "configuration file for the analysis pipeline"
properties:
  samplesheet:
    type: string
    description: "path to the sample sheet in tsv format"
  genome:
    type: object
    description: "Arbitrary named genome entries"
    additionalProperties:
      type: object
      properties:
        source:
          type: string
          enum: ["local", "ncbi"]
          description: "Source of the genome: 'local' or 'ncbi'"
        prefix:
          type: [string, "null"]
          description: "Prefix to be added to start of contig names, helpful for filtering contigs/chromosomes"
        local:
          type: object
          description: "Path to local genome files"
          properties:
            fasta:
              type: [string, "null"]
              description: "Path to local genome fasta; required when source is 'local'"
            gff:
              type: [string, "null"]
              description: "Path to local genome gff; required when source is 'local'"
          required:
            - fasta
            - gff
        datasets:
          type: object
          description: "NCBI assembly ID or genbank ID; required when source is 'ncbi'"
          properties:
            genbank:
              type: [string, "null"]
              description: "NCBI Genbank ID"
            assembly:
              type: [string, "null"]
              description: "NCBI genome assembly accession"
            extra:
              type: [string, "null"]
              description: "NCBI database to query (e.g. nuccore)"
          anyOf:
            - required: [genbank]
            - required: [assembly]
      required:
        - source
      # When source is "local": local_path must be a non-null
      if:
        properties:
          source:
            const: "local"
      then:
        required:
          - local
          - local
      # When source is "ncbi": id and db must be non-null
      if:
        properties:
          source:
            const: "ncbi"
      then:
        required:
          - datasets
    minProperties: 1
  mapping:
    type: object
    properties:
      fastq_dir:
        type: [string, "null"]
        description: location of preprocessed fastq files ready for mapping
      tool:
        type: string
        description: mapping tool to use, one of 'bowtie2', 'bwa_mem2', 'star', or 'minimap2'
        default: bwa_mem2
      bowtie2:
        type: object
        properties:
          index:
            type: string
            description: additional arguments to bowtie build
          extra:
            type: string
            description: additional arguments to bowtie align
      bwa_mem2:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to bwa-mem2
          sort:
            type: string
            description: sorting tool to use, e.g. 'samtools'
            default: samtools
          sort_order:
            type: string
            description: sorting order to use
            default: coordinate
          sort_extra:
            type: string
            description: additional arguments to pass to the sorting tool
      star:
        type: object
        properties:
          index:
            type: string
            description: additional arguments to STAR index
          extra:
            type: array
            items:
              type: string
            description: additional arguments to STAR align
            default: ["--outFilterMultimapNmax 10", "--outSAMmultNmax 1", "--outMultimapperOrder Random", "--alignIntronMax 1"]
      minimap2:
        type: object
        properties:
          index:
            type: string
            description: additional arguments to minimap2 index
          extra:
            type: string
            description: additional arguments to minimap2 align
            default: -ax map-ont
          sorting:
            type: string
            description: sorting order to use
            default: coordinate
          sort_extra:
            type: string
            description: additional arguments to pass to the sorting tool
  mapping_postprocessing:
    type: object
    properties:
      samtools_sort:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to Samtools sort
            default: -m 4G
      samtools_index:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to Samtools index
      deduplication:
        type: object
        properties:
          enabled:
            type: boolean
            description: whether to enable deduplication
            default: false
          tool:
            type: string
            description: deduplication tool to use, one of 'umi_tools', "samtools_markdup", or "picard_markduplicates"
            default: umi_tools
          umi_tools:
            type: object
            properties:
              extra:
                type: string
                description: additional arguments to pass to umi_tools dedup
        required:
          - enabled
  mapping_stats:
    type: object
    properties:
      gffread:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to GFFread
      rseqc_infer_experiment:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to RSeQC infer_experiment.py
      rseqc_bam_stat:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to RSeQC bam_stat.py
      deeptools_coverage:
        type: object
        properties:
          genome_size:
            type: integer
            description: genome size in base pairs
            default: 1000
          extra:
            type: string
            description: additional arguments to pass to DeepTools bamCoverage
    required:
      - gffread
      - rseqc_infer_experiment
      - rseqc_bam_stat
      - deeptools_coverage
required:
  - samplesheet
  - genome
  - mapping
  - mapping_stats
