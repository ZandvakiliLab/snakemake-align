samplesheet: "config/samples.tsv"

# Configs for obtaining genome sequence and annotation
genome:
  cmv:
    source: "ncbi" # local vs ncbi database
    prefix:
    local:
      fasta: 
      gff:
    datasets:
      genbank: "KF297339.1"
      assembly: ""
      extra: ""
  human:
    source: "local" # local vs ncbi database
    prefix:
    local:
      fasta: "data/chrMT.fna"
      gff: "data/chrMT.gff"
    datasets:
      genbank:
      assembly:
      extra: 

# Configs for fastq files
get_fastq:
  PE: True

# Configs for alignment tools
mapping:
  fastq_dir: "data"
  tool: "star"
  bowtie2:
    index: ""
    extra: ""
  bwa_mem2:
    extra: ""
    sort: "samtools"
    sort_order: "coordinate"
    sort_extra: ""
  star:
    index: ""
    extra: ["--outFilterMultimapNmax 10", "--outSAMmultNmax 1", "--outMultimapperOrder Random", "--alignIntronMax 1"]
  minimap2:
    index: ""
    extra: "-ax map-ont"
    sorting: "coordinate"
    sort_extra: ""

# Configs for processing post-alignment
mapping_postprocessing:
  samtools_sort:
    extra: "-m 4G"
  samtools_index:
    extra: ""
  deduplication:
    enabled: true
    tool: "picard"
    umi_tools:
      extra: "" # or directional, cluster, adjacency, etc.
    samtools:
      extra: "-c -r --no-PG"
    picard:
      extra: ""
  filter:
    cmv: "-e 'rname == \"KF297339.1\"'"
    human: "-e 'rname != \"KF297339.1\"'"
    
# Configs for mapping statistics
mapping_stats:
  gffread:
    extra: ""
  rseqc_infer_experiment:
    extra: ""
  rseqc_bam_stat:
    extra: ""
  deeptools_coverage:
    genome_size:
      cmv: 236000
      human: 3130250755
    extra: ""

# Configs for multiqc
qc:
  multiqc:
    extra: "--verbose --dirs"

# ─────────────────────────────────────────────────────────────────────────────
# 4. JBrowse Configs
# ─────────────────────────────────────────────────────────────────────────────

jbrowse:
  path_prefix: "" #No trailing slash
  add_assembly:
    cmv: "--alias 'cmv_tb40' --displayName 'CMV_TB40' --load symlink --force"
    human: "--alias 'human' --displayName 'Human' --load symlink --force"
  add_anno:
    cmv: "--name CMV_TB40_Annotation --load symlink --force"
    human: "--name Human_Annotation --load symlink --force"
  add_bw:
    extra: "--load symlink --force"
  add_cram:
    extra: "--load symlink --force"